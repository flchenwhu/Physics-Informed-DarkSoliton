name: darksoliton
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Deep learning
  - pytorch=2.11
  - torchvision=0.26
  - torchmetrics
  - timm
  - torchinfo
  - einops

  # Numerical / scientific computing
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - scikit-image

  # Image processing / visualization
  - pillow
  - opencv
  - albumentations
  - matplotlib
  - seaborn

  # Experiment utilities
  - pyyaml
  - tqdm
  - rich
  - tensorboard

  # Development / testing
  - pytest
  - ruff
